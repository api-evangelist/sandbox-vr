name: Sandbox VR
description: >-
  Sandbox VR is a location-based virtual reality entertainment company operating
  full-body, free-roam VR experiences for groups of friends, families, and
  corporate teams across 60+ venues in North America, Europe, and Asia. Guests
  play social, multiplayer VR adventures — horror, action, sports, and
  family-friendly titles including licensed properties — using motion-tracked
  suits and headsets. The business spans company-owned and franchised locations,
  online booking, gift cards, parties/events, and an unlimited-pass subscription.
  Backed by a16z and Craft Ventures. Sandbox VR is a consumer entertainment
  operator and, as of this profile, publishes no public developer API, developer
  portal, or API documentation; this record captures the company identity and
  its public web/security posture.
